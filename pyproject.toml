[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ieeg_recon"
version = "1.0.0"
description = "A pipeline for reconstructing iEEG electrode locations"
readme = "README.md"
authors = [
    { name = "Nishant Sinha", email = "nishants@seas.upenn.edu" }
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "nibabel>=3.2.0",
    "scipy>=1.7.0",
    "python-dotenv>=0.19.0",
    "bids2table>=0.1.0",
    "ipykernel>=6.0.0",
    "picsl_greedy>=0.0.5",
    "trimesh>=3.0.0",
    "Rtree>=1.0.0",
    "nilearn>=0.10.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
    "kaleido>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "setuptools>=65.0.0",
    "wheel>=0.37.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/n-sinha/ieeg_recon"
Repository = "https://github.com/n-sinha/ieeg_recon.git"

[project.scripts]
ieeg-recon = "ieeg_recon.run_ieeg_recon:main"

[tool.setuptools]
packages = ["ieeg_recon"]

[tool.setuptools.package-data]
ieeg_recon = ["*.txt", "*.json"]
